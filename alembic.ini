# Alembic configuration.
#
# sqlalchemy.url is deliberately NOT set here — alembic/env.py imports it from
# database.db, so the application and the migrations can never disagree about
# which database they are pointing at. Override with the DATABASE_URL
# environment variable.

[alembic]
script_location = alembic

# Migration filenames get a zero-padded sequence prefix so they sort in apply
# order in a directory listing.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .

# `timezone` is intentionally unset: Alembic resolves it through zoneinfo,
# which needs the tzdata package on Windows. Not worth a dependency for a
# comment in a file header.


[post_write_hooks]
# No formatting hooks configured.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
